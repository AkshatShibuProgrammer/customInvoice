// Implementation to include in your code:
async function geminiGenerateText(promptText) {
    const apiKey = ""; 
    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
    const response = await fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
    });
    if (!response.ok) throw new Error(`API Error: ${response.status}`);
    const result = await response.json();
    return result?.candidates?.[0]?.content?.parts?.[0]?.text || "No text generated.";
}

// Implementation to include in your code:
async function geminiSearchText(searchQuery) {
    const apiKey = ""; 
    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
    const response = await fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            contents: [{ parts: [{ text: `Search the web for: "${searchQuery}". Provide a concise summary.` }] }],
            tools: [{ googleSearch: {} }]
        })
    });
    if (!response.ok) throw new Error(`API Error: ${response.status}`);
    const result = await response.json();
    return result?.candidates?.[0]?.content?.parts?.[0]?.text || "No search results.";
}

// Implementation to include in your code:
async function geminiImageCreation(imagePrompt) {
    const apiKey = ""; 
    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;
    const response = await fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            instances: [{ prompt: imagePrompt }],
            parameters: { sampleCount: 1, aspectRatio: "16:9" }
        })
    });
    if (!response.ok) throw new Error(`API Error: ${response.status}`);
    const result = await response.json();
    const base64Encoded = result?.predictions?.[0]?.bytesBase64Encoded;
    if (!base64Encoded) throw new Error("No image data returned.");
    return `data:image/png;base64,${base64Encoded}`;
}

    function below1000(n) {
      let s = '';
      if (n >= 100) { s += ones[Math.floor(n / 100)] + ' Hundred'; n %= 100; if (n) s += ' '; }
      if (n >= 20) { s += tens[Math.floor(n / 10)]; if (n % 10) s += ' ' + ones[n % 10]; }
      else if (n > 0) { s += ones[n]; }
      return s;
    }
    function intToWords(n) {
      if (n === 0) return 'Zero';
      const parts = [];
      const crore = Math.floor(n / 10000000); n %= 10000000;
      const lakh = Math.floor(n / 100000); n %= 100000;
      const thousand = Math.floor(n / 1000); n %= 1000;
      if (crore) parts.push(intToWords(crore) + ' Crore');
      if (lakh) parts.push(below1000(lakh) + ' Lakh');
      if (thousand) parts.push(below1000(thousand) + ' Thousand');
      if (n) parts.push(below1000(n));
      return parts.join(' ');
    }
    function amountInWords(amount) {
      if (!Number.isFinite(amount) || amount < 0) return 'Invalid amount';
      const totalPaisa = Math.round((amount + Number.EPSILON) * 100);
      const rupees = Math.floor(totalPaisa / 100);
      const paisa = totalPaisa % 100;
      let s = intToWords(rupees) + ' Rupees';
      if (paisa) s += ' And ' + intToWords(paisa) + ' Paisa';
      return s + ' Only';
    }

    // - Monday to Friday: Dinner -> Hotel Nivant Transit Quarter
    // - Monday to Friday: Lunch / Snacks -> TCS SP2, Phase 3, Rajiv Gandhi Infotech Park, Hinjawadi, Pune, Maharashtra 411057
    const PUNE_ADDR_HOTEL = 'Hotel Nivant Transit Quarter 19, Street Number 7 Palam Colony, Raj Nagar I, Raj Nagar, Phase 3, Rajiv Gandhi Infotech Park, Hinjawadi, Pimpri-Chinchwad, Maharashtra 411057';
    const PUNE_ADDR_OFFICE = 'TCS SP2, Phase 3, Rajiv Gandhi Infotech Park, Hinjawadi, Pune, Maharashtra 411057';

    function getSmartPuneAddress(dateStr, mealType) {
      // Parse date DD/MM/YYYY or YYYY-MM-DD
      let d = new Date();
      if (dateStr) {
        if (dateStr.includes('/')) {
          const parts = dateStr.split('/');
          d = new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
        } else if (dateStr.includes('-')) {
          d = new Date(dateStr);
        }
      }
      const dayOfWeek = d.getDay(); // 0 = Sunday, 6 = Saturday
      const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);

      if (isWeekend) {
        return PUNE_ADDR_HOTEL;
      }
      if (mealType === 'dinner') {
        return PUNE_ADDR_HOTEL;
      }
      return PUNE_ADDR_OFFICE;
    }

    function parseAssistantResponse(text) {

        return JSON.parse(clean);
      } catch (e) {
        throw new Error('Could not parse AI response as JSON. Please retry.');
      }
    }

    function prepareDraft(data, draft, options) {
      const restaurants = [...data.restaurants];
      const addresses = [...data.addresses];
      const newRestaurants = [];
      const newAddresses = [];
      const issues = [];
      const notes = [];

      const orders = (draft.orders || []).map((d, idx) => {
        const label = 'Order ' + (idx + 1);
        let restaurant = d.restaurant.existingId ? restaurants.find(r => r.id === d.restaurant.existingId) : null;
        if (!restaurant) {
          restaurant = {
            id: uid(),
            restaurantName: d.restaurant.restaurantName || 'Restaurant Name',
            legalEntityName: d.restaurant.legalEntityName || d.restaurant.restaurantName || 'Legal Entity',
            restaurantAddress: d.restaurant.restaurantAddress || 'Address',
            restaurantGstin: d.restaurant.restaurantGstin || '',
            restaurantFssai: d.restaurant.restaurantFssai || ''
          };
          restaurants.push(restaurant);
          newRestaurants.push(restaurant);
        }

        let address = d.address.existingId ? addresses.find(a => a.id === d.address.existingId) : null;
        if (!address) {
          address = {
            id: uid(),
            label: d.address.label || 'Delivery Address',
            customerName: d.address.customerName || 'Customer Name',
            deliveryAddress: d.address.deliveryAddress || 'Delivery Address',
            stateName: d.address.stateName || 'Madhya Pradesh (23)'
          };
          addresses.push(address);
          newAddresses.push(address);
        }

        const items = (d.items || []).map((item, i) => {
          const qty = item.quantity || (options.useDefaults ? 1 : 1);
          const price = item.unitPrice != null ? item.unitPrice : 0;
          return {
            id: uid(),
            particulars: item.name ? `${qty} x ${item.name}` : 'Food Item',
            grossValue: String((qty * price).toFixed(2)),
            discount: String(item.discount != null ? item.discount : (options.useDefaults ? '0' : '0')),
            cgstRate: String(item.cgstRate != null ? item.cgstRate : '2.5'),
            sgstRate: String(item.sgstRate != null ? item.sgstRate : '2.5')
          };
        });

        const includePlatform = d.includePlatformInvoice != null ? d.includePlatformInvoice : (options.useDefaults ? true : true);
        const platformFee = d.platformFee != null ? String(d.platformFee) : '14.90';

        return {
          id: uid(),
          restaurantId: restaurant.id,
          addressId: address.id,
          invoiceDate: d.invoiceDate || todayDDMMYYYY(),
          invoiceTime: d.invoiceTime || '',
          invoiceNo: d.invoiceNo || (options.generateReferences ? genInvoiceNo() : ''),
          orderId: d.orderId || (options.generateReferences ? genOrderId() : ''),
          items: items.length ? items : [{ id: uid(), particulars: 'Food Item', grossValue: '100', discount: '0', cgstRate: '2.5', sgstRate: '2.5' }],
          includePlatformInvoice: includePlatform,
          platformInvoiceNo: d.platformInvoiceNo || (options.generateReferences ? genPlatformInvoiceNo() : ''),
          platformFee: platformFee
        };
      });

      return {
        preview: { ...data, restaurants, addresses, orders: [...data.orders, ...orders] },
        newOrders: orders,
        newRestaurants,
        newAddresses,
        issues,
        notes
      };
    }

    // AI Send Action
    async function sendAssistantMessage() {
      const txt = state.assistantInput.trim();
      if (!txt || state.assistantBusy) return;

      state.messages.push({ role: 'user', text: txt });
      state.assistantInput = '';
      state.assistantBusy = true;
      state.assistantError = '';
      render();

      try {
        const prompt = createAssistantPrompt(state.messages, state.currentDraft, state.data, state.shareContext, state.draftOptions);
        const resText = await geminiGenerateText(prompt);
        const parsed = parseAssistantResponse(resText);
        state.currentDraft = parsed;
        state.preparedDraft = prepareDraft(state.data, parsed, state.draftOptions);
        state.messages.push({ role: 'assistant', text: parsed.message || 'Draft prepared. Review the details below.' });
      } catch (err) {
        state.assistantError = err.message || 'Assistant request failed.';
      } finally {
        state.assistantBusy = false;
        render();
      }
    }

        addresses: [...state.data.addresses, ...state.preparedDraft.newAddresses],

      snap.textContent = JSON.stringify({ version: 1, workspaceId: 'export-' + uid(), data: dataToSave });

      const htmlStr = '<!doctype html>\n' + docClone.outerHTML;
      const blob = new Blob([htmlStr], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'eternal-invoice-generator-ai.html';

      a.click();

    function generatePizzaHutQR(invNo, dateTime, itemsCount, total, sgst, cgst) {

                                <th style="padding: 4px; width: 50px;">Tax %</th>
                                <th style="padding: 4px; width: 30px;"></th>
                              </tr>
                            </thead>
                            <tbody>
                              ${o.items.map((it, itemIdx) => `
                                <tr>
                                  <td style="padding: 3px;"><input type="text" style="width: 100%; font-size: 11px; padding: 2px 4px;" value="${it.particulars}" onchange="state.data.orders[${idx}].items[${itemIdx}].particulars = this.value; saveState();" /></td>
                                  <td style="padding: 3px;"><input type="text" style="width: 100%; font-size: 11px; padding: 2px 4px;" value="${it.grossValue}" onchange="state.data.orders[${idx}].items[${itemIdx}].grossValue = this.value; saveState();" /></td>
                                  <td style="padding: 3px;"><input type="text" style="width: 100%; font-size: 11px; padding: 2px 4px;" value="${it.discount}" onchange="state.data.orders[${idx}].items[${itemIdx}].discount = this.value; saveState();" /></td>
                                  <td style="padding: 3px;"><input type="text" style="width: 100%; font-size: 11px; padding: 2px 4px;" value="${it.cgstRate}" onchange="state.data.orders[${idx}].items[${itemIdx}].cgstRate = this.value; state.data.orders[${idx}].items[${itemIdx}].sgstRate = this.value; saveState();" /></td>
                                  <td style="padding: 3px; text-align: center;"><button class="btn-icon" onclick="state.data.orders[${idx}].items.splice(${itemIdx}, 1); saveState();">✕</button></td>
                                </tr>
                              `).join('')}
                            </tbody>
                          </table>
                        </div>

                        <!-- Platform Invoice Option -->
                        <div style="margin-top: 10px; padding-top: 10px; border-top: 1px dashed #cbd5e1; display: flex; align-items: center; gap: 14px;">
                          <label style="font-size: 11px; display: flex; align-items: center; gap: 6px; cursor: pointer;">
                            <input type="checkbox" ${o.includePlatformInvoice ? 'checked' : ''} onchange="state.data.orders[${idx}].includePlatformInvoice = this.checked; saveState();" />
                            <strong>Include Separate Platform Fee Invoice</strong>
                          </label>
                          ${o.includePlatformInvoice ? `
                            <input type="text" style="width: 80px; padding: 3px 6px; font-size: 11px;" value="${o.platformFee}" placeholder="14.90" onchange="state.data.orders[${idx}].platformFee = this.value; saveState();" />
                          ` : ''}
                        </div>
                      </div>
                    `;
                  }).join('')}
                ` : ''}

                <!-- Subtab 2: Profiles -->
                ${state.manualSubTab === 'profiles' ? `
                  <div style="margin-bottom: 24px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                      <span style="font-size: 13px; font-weight: 700;">Restaurants (${state.data.restaurants.length})</span>
                      <button class="btn btn-secondary btn-sm" onclick="
                        state.data.restaurants.push({ id: uid(), legalEntityName: 'Entity Name', restaurantName: 'New Restaurant', restaurantAddress: 'Address', restaurantGstin: '', restaurantFssai: '' });
                        saveState();
                      ">+ Add Restaurant</button>
                    </div>
                    ${state.data.restaurants.map((r, rIdx) => `
                      <div class="card-item">
                        <div class="form-grid">
                          <div class="form-group"><label>Restaurant Name</label><input type="text" value="${r.restaurantName}" onchange="state.data.restaurants[${rIdx}].restaurantName = this.value; saveState();" /></div>
                          <div class="form-group"><label>Legal Entity</label><input type="text" value="${r.legalEntityName}" onchange="state.data.restaurants[${rIdx}].legalEntityName = this.value; saveState();" /></div>
                          <div class="form-group"><label>Address</label><input type="text" value="${r.restaurantAddress}" onchange="state.data.restaurants[${rIdx}].restaurantAddress = this.value; saveState();" /></div>
                          <div class="form-group"><label>GSTIN</label><input type="text" value="${r.restaurantGstin}" onchange="state.data.restaurants[${rIdx}].restaurantGstin = this.value; saveState();" /></div>
                          <div class="form-group"><label>FSSAI</label><input type="text" value="${r.restaurantFssai}" onchange="state.data.restaurants[${rIdx}].restaurantFssai = this.value; saveState();" /></div>
                        </div>
                      </div>
                    `).join('')}
                  </div>

                  <div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                      <span style="font-size: 13px; font-weight: 700;">Delivery Addresses (${state.data.addresses.length})</span>
                      <button class="btn btn-secondary btn-sm" onclick="
                        state.data.addresses.push({ id: uid(), label: 'Work', customerName: 'Customer Name', deliveryAddress: 'Delivery Address', stateName: 'Madhya Pradesh (23)' });
                        saveState();
                      ">+ Add Address</button>
                    </div>
                    ${state.data.addresses.map((a, aIdx) => `
                      <div class="card-item">
                        <div class="form-grid">
                          <div class="form-group"><label>Label</label><input type="text" value="${a.label}" onchange="state.data.addresses[${aIdx}].label = this.value; saveState();" /></div>
                          <div class="form-group"><label>Customer Name</label><input type="text" value="${a.customerName}" onchange="state.data.addresses[${aIdx}].customerName = this.value; saveState();" /></div>
                          <div class="form-group"><label>Address</label><input type="text" value="${a.deliveryAddress}" onchange="state.data.addresses[${aIdx}].deliveryAddress = this.value; saveState();" /></div>
                          <div class="form-group"><label>State (Place of Supply)</label><input type="text" value="${a.stateName}" onchange="state.data.addresses[${aIdx}].stateName = this.value; saveState();" /></div>
                        </div>
                      </div>
                    `).join('')}
                  </div>
                ` : ''}

                <!-- Subtab 3: Company Settings -->
                ${state.manualSubTab === 'settings' ? `
                  <div class="card-item">
                    <strong style="font-size: 14px; display: block; margin-bottom: 12px;">Corporate Details (Eternal / Zomato)</strong>
                    <div class="form-grid">
                      <div class="form-group"><label>PAN</label><input type="text" value="${state.data.common.eternalPan}" onchange="state.data.common.eternalPan = this.value; saveState();" /></div>
                      <div class="form-group"><label>CIN</label><input type="text" value="${state.data.common.eternalCin}" onchange="state.data.common.eternalCin = this.value; saveState();" /></div>
                      <div class="form-group"><label>GSTIN</label><input type="text" value="${state.data.common.eternalGst}" onchange="state.data.common.eternalGst = this.value; saveState();" /></div>
                      <div class="form-group"><label>FSSAI</label><input type="text" value="${state.data.common.eternalFssai}" onchange="state.data.common.eternalFssai = this.value; saveState();" /></div>
                      <div class="form-group"><label>Restaurant HSN</label><input type="text" value="${state.data.common.hsnCode}" onchange="state.data.common.hsnCode = this.value; saveState();" /></div>
                      <div class="form-group"><label>Platform HSN</label><input type="text" value="${state.data.common.platformHsn}" onchange="state.data.common.platformHsn = this.value; saveState();" /></div>
                      <div class="form-group"><label>Signatory Text</label><input type="text" value="${state.data.common.authorisedSignatory}" onchange="state.data.common.authorisedSignatory = this.value; saveState();" /></div>
                      <div class="form-group"><label>Support Email</label><input type="text" value="${state.data.common.eternalEmail}" onchange="state.data.common.eternalEmail = this.value; saveState();" /></div>
                    </div>
                    <div class="form-group" style="margin-top: 10px;">
                      <label>Section 9(5) CGST Note</label>
                      <textarea rows="3" onchange="state.data.common.section95Note = this.value; saveState();">${state.data.common.section95Note}</textarea>
                    </div>
                  </div>
                ` : ''}
              ` : ''}

              <!-- TAB 3: AI Web Search (Grounding) -->
              ${state.activeTab === 'search' ? `
                <div class="search-container">
                  <div class="assistant-intro">
                    <div class="assistant-tag" style="color: #059669;">
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                      Google Search Grounding
                    </div>
                    <h2>Live Search & Verification</h2>
                    <p>Search online GST rates, HSN codes, official restaurant registrations, or tax laws in real-time.</p>
                  </div>

                  <div class="search-box">
                    <input
                      type="text"
                      placeholder="Search web for GST rules, restaurant details, HSN codes..."
                      value="${state.searchQuery}"
                      oninput="state.searchQuery = this.value;"
                      onkeydown="if (event.key === 'Enter') executeSearch();"
                    />
                    <button class="btn btn-emerald" onclick="executeSearch();" ${state.searchBusy ? 'disabled' : ''}>
                      ${state.searchBusy ? 'Searching...' : 'Search'}
                    </button>
                  </div>

                  <div class="search-chips">
                    <span class="chip" onclick="state.searchQuery = 'GST tax rates for restaurant dining and food delivery in India'; executeSearch();">GST rate for food delivery</span>
                    <span class="chip" onclick="state.searchQuery = 'HSN code 996331 GST rates and service explanation'; executeSearch();">HSN 996331 rules</span>
                    <span class="chip" onclick="state.searchQuery = 'Section 9(5) CGST Act 2017 e-commerce restaurant liability'; executeSearch();">Section 9(5) explanation</span>
                  </div>

                  ${state.searchResult ? `
                    <div class="search-results">${state.searchResult}</div>
                  ` : ''}
                </div>
              ` : ''}

              <!-- TAB 4: AI Branding Studio -->
              ${state.activeTab === 'branding' ? `
                <div class="branding-container">
                  <div class="assistant-intro">
                    <div class="assistant-tag" style="color: var(--accent-purple);">
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"></path></svg>
                      Imagen 4.0 Powered
                    </div>
                    <h2>AI Branding Studio</h2>
                    <p>Generate authentic restaurant seals, official stamps, and invoice banners directly with Imagen.</p>
                  </div>

                  <div class="form-group">
                    <label>Image Description / Prompt</label>
                    <textarea
                      rows="3"
                      placeholder="E.g., Official circular rubber seal stamp in red ink with text 'AUTHORIZED SIGNATORY' and star emblem on plain background"
                      oninput="state.imagePrompt = this.value;"
                    >${state.imagePrompt}</textarea>
                  </div>

                  <div class="search-chips" style="margin-bottom: 12px;">
                    <span class="chip" onclick="state.imagePrompt = 'Official circular red rubber stamp seal with text AUTHORISED SIGNATORY, sharp vector style on plain white'; render();">Official Stamp</span>
                    <span class="chip" onclick="state.imagePrompt = 'Elegant minimalist golden emblem logo for Sagar Gaire Gourmet Bistro on plain background'; render();">Bistro Logo</span>
                    <span class="chip" onclick="state.imagePrompt = 'Modern corporate red banner header for food logistics enterprise, minimalist clean design'; render();">Header Banner</span>
                  </div>

                  <button class="btn btn-purple" onclick="executeImageGeneration();" ${state.imageBusy || !state.imagePrompt.trim() ? 'disabled' : ''}>
                    ${state.imageBusy ? 'Generating with Imagen...' : 'Generate Image'}
                  </button>

                  ${state.generatedImage ? `
                    <div class="branding-preview-box">
                      <img src="${state.generatedImage}" alt="AI Generated" />
                      <div style="display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; justify-content: center;">
                        <button class="btn btn-primary btn-sm" onclick="state.customSignature = state.generatedImage; render(); showToast('Applied as invoice stamp!');">
                          Set as Invoice Signature/Stamp
                        </button>
                        <button class="btn btn-secondary btn-sm" onclick="state.customBanner = state.generatedImage; render(); showToast('Applied as invoice banner!');">
                          Set as Invoice Banner
                        </button>
                      </div>
                    </div>
                  ` : ''}

                  <div style="border-top: 1px solid var(--workspace-line); padding-top: 14px; margin-top: 10px;">
                    <span style="font-size: 11px; color: var(--workspace-muted); display: block; margin-bottom: 8px;">Current Active Assets:</span>
                    <div style="display: flex; gap: 10px; align-items: center;">
                      <img src="${state.customSignature}" style="height: 40px; border: 1px solid #cbd5e1; border-radius: 4px; padding: 2px;" alt="Signature" />
                      <img src="${state.customBanner}" style="height: 40px; border: 1px solid #cbd5e1; border-radius: 4px; padding: 2px;" alt="Banner" />
                      <button class="btn btn-secondary btn-sm" onclick="state.customSignature = DEFAULT_SIGNATURE_URL; state.customBanner = DEFAULT_BANNER_URL; render(); showToast('Reset to original images.');">
                        Reset Defaults
                      </button>
                    </div>
                  </div>
                </div>
              ` : ''}
            </div>

            <div class="editor-footer">
              <span>All calculations computed in Indian Rupees (INR).</span>
              <button class="btn btn-secondary btn-sm" onclick="resetWorkspace();">Reset to sample</button>
            </div>
          </section>

          <!-- Right Column: Print-Ready Live Preview -->
          <section class="preview-panel">
            <div class="preview-header">
              <div>
                <span style="font-size: 10px; font-weight: 700; color: #64748b; letter-spacing: 0.8px;">PRINT PREVIEW</span>
                <h3 style="font-size: 15px; font-weight: 700;">Live Documents (A4)</h3>
              </div>
              <div class="preview-controls">
                <select style="font-size: 12px; padding: 4px 8px; border-radius: 4px; border: 1px solid #cbd5e1;" onchange="state.selectedOrderId = this.value || null; render();">
                  <option value="">All Invoices (${state.data.orders.length} orders)</option>
                  ${state.data.orders.map((o, idx) => `
                    <option value="${o.id}" ${state.selectedOrderId === o.id ? 'selected' : ''}>#${idx + 1} - ${o.invoiceDate} (${o.invoiceNo})</option>
                  `).join('')}
                </select>
                <button class="btn btn-secondary btn-sm" onclick="state.scale = Math.max(0.5, state.scale - 0.1); render();">-</button>
                <span style="font-size: 11px; font-weight: 600; min-width: 38px; text-align: center;">${Math.round(state.scale * 100)}%</span>
                <button class="btn btn-secondary btn-sm" onclick="state.scale = Math.min(1.4, state.scale + 0.1); render();">+</button>
              </div>
            </div>

            <div class="preview-scroll">
              <div class="preview-stack" style="transform: scale(${state.scale});">
                ${invoicesHtml}
              </div>
            </div>
          </section>
        </main>

        <!-- Download Modal -->
        ${state.downloadModalOpen ? `
          <div class="modal-overlay" onclick="if (event.target === this) { state.downloadModalOpen = false; render(); }">
            <div class="modal-card">
              <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 8px;">Download Standalone HTML</h2>
              <p style="font-size: 12px; color: var(--workspace-muted); line-height: 1.6; margin-bottom: 16px;">
                Export a completely self-contained single HTML file with all CSS, images, and AI functionality embedded. Runs offline or inside any Gemini Canvas environment!
              </p>

              <label style="display: flex; gap: 10px; align-items: flex-start; padding: 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 20px; cursor: pointer;">
                <input type="checkbox" ${state.includeDataInDownload ? 'checked' : ''} onchange="state.includeDataInDownload = this.checked;" style="margin-top: 3px;" />
                <div>
                  <strong style="font-size: 12px; color: #1e293b;">Include my current saved invoices & profiles</strong>
                  <span style="display: block; font-size: 11px; color: #64748b;">The downloaded file will open with your current data already loaded.</span>
                </div>
              </label>

              <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button class="btn btn-secondary" onclick="state.downloadModalOpen = false; render();">Cancel</button>
                <button class="btn btn-primary" onclick="downloadStandaloneHtml();">Download Single HTML File</button>
              </div>
            </div>
          </div>
        ` : ''}

        <!-- Toast -->
        ${state.toast ? `
          <div class="toast">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
            <span>${state.toast}</span>
          </div>
        ` : ''}
      `;
    }

    // Initialize App
    loadSavedState();
    render();
  </script>
</body>
</html>
